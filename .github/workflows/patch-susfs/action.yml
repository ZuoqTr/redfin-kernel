name: 'Patch SUSFS for Kernel'

runs:
  using: 'composite'
  steps:
      - name: Clone SUSFS Repository
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[+] Cloning SUSFS repository (kernel-4.19 branch)..."
          GIT_TERMINAL_PROMPT=0 git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu -b kernel-4.19 --depth=1

          echo "[+] SUSFS repository cloned."

      - name: Copy SUSFS Source Files
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[+] Copying SUSFS source files..."

          # Copy fs files (these contain SUSFS hooks)
          for f in susfs4ksu/kernel_patches/fs/*.c susfs4ksu/kernel_patches/fs/*.h; do
            if [ -f "$f" ]; then
              cp -f "$f" fs/
              echo "[+] Copied $(basename $f)"
            fi
          done

          # Copy headers (these contain SUSFS definitions)
          for f in susfs4ksu/kernel_patches/include/linux/*.h; do
            if [ -f "$f" ]; then
              cp -f "$f" include/linux/
              echo "[+] Copied $(basename $f)"
            fi
          done

          echo "[+] All SUSFS source files copied."

      - name: Add susfs.o to fs/Makefile
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[+] Adding susfs.o to fs/Makefile..."

          if ! grep -q "obj-\$(CONFIG_KSU_SUSFS).*susfs.o" fs/Makefile; then
            sed -i '/^obj-y += open.o/a obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile
            echo "[+] susfs.o added to fs/Makefile."
          else
            echo "[+] susfs.o already in fs/Makefile."
          fi

      - name: Add KSU-SUSFS Bridge Functions
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[+] Adding KSU-SUSFS bridge functions..."

          # Check if bridge file exists from susfs4ksu
          if [ -f "susfs4ksu/kernel_patches/KernelSU/ksu_susfs.c" ]; then
            cp -f susfs4ksu/kernel_patches/KernelSU/ksu_susfs.c ./
            echo "[+] Copied ksu_susfs.c"
          fi

          # Add ksu_susfs.o to Makefile if bridge file exists
          if [ -f "ksu_susfs.c" ] && ! grep -q "ksu_susfs.o" Makefile; then
            sed -i '/obj-.*KSU.*+=/a obj-$(CONFIG_KSU_SUSFS) += ksu_susfs.o' Makefile
            echo "[+] ksu_susfs.o added to Makefile."
          fi

      - name: Add SUSFS fields to task_struct
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[+] Adding SUSFS fields to task_struct..."

          # Add TASK_STRUCT_NON_ROOT_USER_APP_PROC to susfs_def.h if not present
          if [ -f "include/linux/susfs_def.h" ] && ! grep -q "TASK_STRUCT_NON_ROOT_USER_APP_PROC" include/linux/susfs_def.h; then
            echo "#define TASK_STRUCT_NON_ROOT_USER_APP_PROC BIT(0)" >> include/linux/susfs_def.h
            echo "[+] TASK_STRUCT_NON_ROOT_USER_APP_PROC added."
          fi

          # Add susfs_task_state to task_struct in sched.h if not present
          if ! grep -q "susfs_task_state" include/linux/sched.h 2>/dev/null; then
            echo "[+] Adding susfs_task_state to task_struct..."

            # Create patch content
            printf '\n#ifdef CONFIG_KSU_SUSFS\n    u64 susfs_task_state;\n    u64 susfs_last_fake_mnt_id;\n#endif\n' > /tmp/susfs_sched_patch.txt

            # Insert before randomized_struct_fields_end using awk
            if grep -q "randomized_struct_fields_end" include/linux/sched.h; then
              awk '/randomized_struct_fields_end/ {while ((getline line < "/tmp/susfs_sched_patch.txt") > 0) print line} {print}' include/linux/sched.h > /tmp/sched.h.new
              mv /tmp/sched.h.new include/linux/sched.h
              echo "[+] susfs_task_state added to task_struct."
            else
              echo "[-] randomized_struct_fields_end not found, skipping task_struct patch."
            fi
          else
            echo "[+] susfs_task_state already in task_struct."
          fi

          echo "[+] SUSFS fields added."

      - name: Set KSU and SUSFS for DEFCONFIG
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[+] Adding SUSFS configs to defconfig..."

          # Add SUSFS configs using echo (avoid heredoc issues)
          echo "CONFIG_KPROBES=n" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          echo "[+] SUSFS configs added."

      - name: Cleanup SUSFS repo
        if: env.SUSFS_ENABLE == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          rm -rf susfs4ksu
          echo "[+] SUSFS repo cleaned up."
