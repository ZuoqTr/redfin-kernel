name: 'Pack kernel with AnyKernel3'

runs:
  using: 'composite'
  steps:
      - name: Make Anykernel3 Flasher
        if: env.PACK_METHOD == 'Anykernel3'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/${{ env.KERNEL_ARCH }}/boot"

          mkdir -p tmp

          # Copy kernel image
          if [[ -f "$IMAGE_DIR/Image.lz4" ]]; then
            cp -fp $IMAGE_DIR/Image.lz4 tmp
            echo "[+] Found Image.lz4!"
          elif [[ -f "$IMAGE_DIR/Image.gz-dtb" ]]; then
            cp -fp $IMAGE_DIR/Image.gz-dtb tmp
            echo "[+] Found Image.gz-dtb!"
          elif [[ -f "$IMAGE_DIR/Image.gz" ]]; then
            cp -fp $IMAGE_DIR/Image.gz tmp
            echo "[+] Found Image.gz!"
          elif [[ -f "$IMAGE_DIR/Image" ]]; then
            cp -fp $IMAGE_DIR/Image tmp
            echo "[+] Found Image!"
          fi

          # Copy dtbo
          if [[ -f "$IMAGE_DIR/dtbo.img" ]]; then
            cp -fp $IMAGE_DIR/dtbo.img tmp
            echo "[+] Found dtbo.img!"
          else
            echo "[-] No dtbo.img found."
          fi

          # Copy dtb
          if [[ -f "$IMAGE_DIR/dtb.img" ]]; then
            cp -fp $IMAGE_DIR/dtb.img tmp
            echo "[+] Found dtb.img!"
          elif [ -f "$IMAGE_DIR/dtb" ]; then
            cp -fp $IMAGE_DIR/dtb tmp
            echo "[+] Found dtb!"
          fi

          # Setup AnyKernel3
          if [[ -d "Anykernel3" ]]; then
            cd Anykernel3

            # Copy custom anykernel.sh from repo root
            if [ -f "$GITHUB_WORKSPACE/anykernel.sh" ]; then
              cp -f $GITHUB_WORKSPACE/anykernel.sh anykernel.sh
              echo "[+] Using custom anykernel.sh"
            fi

            # Copy Image to AnyKernel3
            cp -f ../tmp/Image* Image
            cp -f ../tmp/dtbo.img dtbo.img 2>/dev/null || true
            cp -f ../tmp/dtb* dtb 2>/dev/null || true

            # Set permissions
            chmod -R 755 .
            chmod 644 anykernel.sh zImage Image* dtbo.img dtb 2>/dev/null || true

            cd ..
            echo "[+] AnyKernel3 ready!"
          else
            echo "[-] AnyKernel3 not found!"
            false
          fi

      - name: Make MKBOOTIMG Flasher
        if: env.PACK_METHOD == 'MKBOOTIMG'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE
          IMAGE_DIR="$GITHUB_WORKSPACE/device_kernel/out/arch/${{ env.KERNEL_ARCH }}/boot"

          mkdir -p tmp
          cp -f $IMAGE_DIR/Image* tmp/ 2>/dev/null || true
          cp -f $IMAGE_DIR/dtbo.img tmp/ 2>/dev/null || true

          # Create boot.img using mkbootimg
          python3 mkboottools/mkbootimg.py \
            --kernel tmp/Image \
            --dtbo-img tmp/dtbo.img \
            --output boot.img

          echo "[+] Boot.img created!"
