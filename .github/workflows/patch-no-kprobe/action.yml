name: 'Patch Kernel for no-kprobe hooks (Manual Hooks)'

runs:
  using: 'composite'
  steps:
      - name: Check KernelSU-Next directory
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          echo "[+] Checking KernelSU-Next..."

          if [ -d "KernelSU-Next" ]; then
            echo "[+] KernelSU-Next directory found."

            # Disable kprobe hooks in KernelSU-Next as per official instructions
            echo "[+] Disabling kprobe hooks in KernelSU-Next..."

            find KernelSU-Next -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i \
              's/#ifdef CONFIG_KPROBES/#if defined(CONFIG_KPROBES) \&\& 0/g' {} \;

            echo "[+] Kprobe hooks disabled in KernelSU-Next."
          else
            echo "[-] KernelSU-Next not found, skipping kprobe disable."
          fi

      - name: Add Manual Hook in fs/exec.c
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          echo "[+] Adding manual hook in fs/exec.c..."

          # Check if function exists
          if grep -q "do_execveat_common" fs/exec.c; then
            echo "[+] Found do_execveat_common in fs/exec.c"

            # Add extern declaration after includes
            if ! grep -q "ksu_handle_execveat.*filename_ptr" fs/exec.c; then
              sed -i '/^#include <linux\/sched.h>/a extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, int *flags);' fs/exec.c
              echo "[+] Added extern declaration."
            fi

            # Add hook call - insert before "struct filename *filename" in do_execveat_common
            if ! grep -q "ksu_handle_execveat" fs/exec.c; then
              sed -i '/struct filename \*filename;/i\    ksu_handle_execveat(\&fd, \&filename, \&flags);' fs/exec.c
              echo "[+] Added ksu_handle_execveat call."
            fi
          else
            echo "[-] do_execveat_common not found in fs/exec.c."
          fi

      - name: Add Manual Hook in fs/open.c
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          echo "[+] Adding manual hook in fs/open.c..."

          # Check if function exists
          if grep -q "do_sys_open" fs/open.c; then
            echo "[+] Found do_sys_open in fs/open.c"

            # Add extern declaration after includes
            if ! grep -q "ksu_handle_execveat.*filename_ptr" fs/open.c; then
              sed -i '/^#include <linux\/fs.h>/a extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, int *flags);' fs/open.c
              echo "[+] Added extern declaration."
            fi

            # Add hook call - insert after "fd = get_unused_fd_flags(flags);" if exists, otherwise after function start
            if ! grep -q "ksu_handle_execveat" fs/open.c; then
              sed -i '/get_unused_fd_flags/i\    ksu_handle_execveat(\&fd, \&filename, \&flags);' fs/open.c
              echo "[+] Added ksu_handle_execveat call."
            fi
          else
            echo "[-] do_sys_open not found in fs/open.c."
          fi

      - name: Add Manual Hook in fs/stat.c
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          echo "[+] Adding manual hook in fs/stat.c..."

          # Add extern declaration after includes
          if ! grep -q "ksu_handle_stat.*filename_ptr" fs/stat.c; then
            sed -i '/^#include <linux\/path.h>/a extern int ksu_handle_stat(int *dfd, const char __user **filename_ptr, int *flags);' fs/stat.c
            echo "[+] Added extern declaration."
          fi

          # Check for vfs_statx
          if grep -q "vfs_statx" fs/stat.c; then
            echo "[+] Found vfs_statx in fs/stat.c"
            if ! grep -q "ksu_handle_stat" fs/stat.c; then
              sed -i '/int vfs_statx.*filename.*flags/i\    ksu_handle_stat(\&dfd, \&filename, \&flags);' fs/stat.c
              echo "[+] Added ksu_handle_stat call in vfs_statx."
            fi
          else
            echo "[-] vfs_statx not found in fs/stat.c."
          fi

      - name: Verify Manual Hooks
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          echo "[+] Verifying manual hooks..."

          echo "=== fs/exec.c hooks ==="
          grep -n "ksu_handle_execveat" fs/exec.c || echo "No hooks found"

          echo ""
          echo "=== fs/open.c hooks ==="
          grep -n "ksu_handle_execveat" fs/open.c || echo "No hooks found"

          echo ""
          echo "=== fs/stat.c hooks ==="
          grep -n "ksu_handle_stat" fs/stat.c || echo "No hooks found"

          echo ""
          echo "[+] Hook verification complete."
