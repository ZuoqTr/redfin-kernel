name: 'Prepare kernel and tools'

runs:
  using: 'composite'
  steps:
      - name: Get Kernel
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE

          echo "::group::[+] Starting git clone kernel source code..."
          git clone --recursive "${{ env.KERNEL_SOURCE }}" -b "${{ env.KERNEL_BRANCH }}" device_kernel --depth=1

          if [[ -f "device_kernel/.gitmodules" ]]; then
            cd device_kernel
            git submodule init
            git submodule update
            cd ../
            echo "[+] Detected GitModules."
          fi
          echo "::endgroup::"
          echo "[+] Kernel source code is cloned."

          # Get Kernel Version
          KERNEL_VERSION=$(head -n 3 $GITHUB_WORKSPACE/device_kernel/Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')
          echo "KERNEL_VERSION=$(head -n 3 device_kernel/Makefile | grep -E 'VERSION|PATCHLEVEL' | awk '{print $3}' | paste -sd '.')" >> $GITHUB_ENV
          echo "FIRST_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $1}')" >> $GITHUB_ENV
          echo "SECOND_VERSION=$(echo "$KERNEL_VERSION" | awk -F '.' '{print $2}')" >> $GITHUB_ENV
          echo "KERNEL_VERSION=$KERNEL_VERSION"

      - name: Get Kernel Arch
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          if [[ -d "arch/arm64/configs" ]]; then
            echo "KERNEL_ARCH=arm64" >> $GITHUB_ENV
          elif [[ -d "arch/arm/configs" ]]; then
            echo "KERNEL_ARCH=arm" >> $GITHUB_ENV
          else
            echo "[-] Non-ARM64/ARM Devies not supported!"
            false
          fi
          echo "KERNEL_ARCH=$KERNEL_ARCH"

      - name: Get Clang
        if: env.CLANG_SOURCE != ''
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE

          echo "::group::[+] Downloading Clang..."
          if [[ "${{ env.CLANG_SOURCE }}" == *"releases"* ]]; then
            # Download from GitHub releases (may be .tar.zst, .tar.xz, .tar.gz)
            wget -L -q "${{ env.CLANG_SOURCE }}/${{ env.CLANG_BRANCH }}" -O clang.tar
            echo "[+] Tarball downloaded."
            ls -la clang.tar 2>/dev/null || echo "[-] Download failed!"

            # Detect compression type and extract
            if [[ "${{ env.CLANG_BRANCH }}" == *".zst"* ]]; then
              tar -I zstd -xf clang.tar
            elif [[ "${{ env.CLANG_BRANCH }}" == *".xz"* ]]; then
              tar -Jxf clang.tar
            else
              tar -xf clang.tar
            fi
            rm clang.tar
            echo "[+] Clang extracted."
            ls -la

            # Setup bin path - LLVM releases extract to clang+llvm-*/
            mkdir -p clang-custom
            # LLVM tarball structure: clang+llvm-*/bin/clang
            if [ -d "clang+llvm-*/bin" ]; then
              CLANG_BIN=$(find . -path "*/bin/clang" -type f -executable 2>/dev/null | head -1)
              if [ -n "$CLANG_BIN" ]; then
                CLANG_DIR=$(dirname "$CLANG_BIN")
                ln -sfn "$CLANG_DIR" clang-custom/bin
                echo "[+] Symlinked: $CLANG_DIR"
                ls -la clang-custom/bin/clang* 2>/dev/null
              else
                echo "[-] Could not find clang in bin/ subdirectory!"
                ls -la clang+llvm-*/bin/ 2>/dev/null | head -10
              fi
            else
              echo "[-] bin/ directory not found!"
              ls -la clang+llvm-*/ 2>/dev/null | head -10
            fi
          elif [[ "${{ env.CLANG_SOURCE }}" == *"googlesource"* ]]; then
            # Download AOSP clang tarball directly
            wget -q "${{ env.CLANG_SOURCE }}/+archive/${{ env.CLANG_BRANCH }}.tar.gz" -O clang.tar.gz
            tar -xzf clang.tar.gz
            rm clang.tar.gz
            echo "[+] Clang tarball extracted."

            # Find clang bin directory - AOSP clang structure varies
            mkdir -p clang-custom
            if [ -d "prebuilts/clang/host/linux-x86/bin" ]; then
              ln -sfn "$(pwd)/prebuilts/clang/host/linux-x86" clang-custom/bin
              echo "[+] Symlinked: prebuilts/clang/host/linux-x86/bin"
            elif [ -d "clang/bin" ]; then
              ln -sfn "$(pwd)/clang" clang-custom/bin
              echo "[+] Symlinked: clang/bin"
            else
              # Search for clang binary anywhere
              CLANG_PATH=$(find . -name "clang" -type f -executable 2>/dev/null | head -1)
              if [ -n "$CLANG_PATH" ]; then
                CLANG_DIR=$(dirname "$CLANG_PATH")
                ln -sfn "$CLANG_DIR" clang-custom/bin
                echo "[+] Symlinked: $CLANG_DIR"
              else
                echo "[-] Could not find clang binary!"
                ls -la
                find . -type d -name "*clang*" 2>/dev/null | head -10
              fi
            fi
          else
            git clone "${{ env.CLANG_SOURCE }}" -b "${{ env.CLANG_BRANCH }}" clang-custom --depth=1
            echo "[+] Clang cloned."
          fi
          echo "::endgroup::"

      - name: Get GCC
        if: env.GCC_GNU == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE

          if [ -n "$GCC_64_SOURCE" ]; then
            echo "::group::[+] Downloading GCC 64..."
            git clone "$GCC_64_SOURCE" -b "$GCC_64_BRANCH" gcc64 --depth=1
            echo "::endgroup::"
          fi

          if [ -n "$GCC_32_SOURCE" ]; then
            echo "::group::[+] Downloading GCC 32..."
            git clone "$GCC_32_SOURCE" -b "$GCC_32_BRANCH" gcc32 --depth=1
            echo "::endgroup::"
          fi

      - name: Get Packing Tools
        shell: bash
        run: |
          # Set ${{ env.PACK_METHOD }}

          if [[ "${{ env.PACK_METHOD }}" == "Anykernel3" ]]; then
            cd $GITHUB_WORKSPACE/device_kernel

            if [[ -d "Anykernel3" ]]; then
              echo "[+] Found Anykernel3 in Kernel!"
            elif [[ "${{ env.AK3_SOURCE }}" == *"osm0sis/AnyKernel3.git" ]]; then
              git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3
              cd Anykernel3
              git checkout dca9dc370838d919d56c1f59ec78b27a14a72c68
              cd ../
              echo "[+] Get Anykernel3 successfully!"
            else
              git clone "${{ env.AK3_SOURCE }}" -b "${{ env.AK3_BRANCH }}" Anykernel3 --depth=1
            fi
          elif [[ "${{ env.PACK_METHOD }}" == "MKBOOTIMG" ]] || [ "${{ env.DEFCONFIG_FROM_BOOT }}" == "true" ]; then
            cd $GITHUB_WORKSPACE
            git clone https://android.googlesource.com/platform/system/tools/mkbootimg $GITHUB_WORKSPACE/mkboottools -b main-kernel-build-2024 --depth=1
            if [ -n "${{ env.BOOT_SOURCE }}" ]; then
              ${{ env.CURLX }} ${{ env.BOOT_SOURCE }} $GITHUB_WORKSPACE/boot_source_${{ env.DEVICE_NAME }}.img
            fi
            echo "[+] Get MKBOOTIMG successfully!"
            cd device_kernel
          else
            echo "[-] Need packing method!"
            false
          fi

      - name: Setup KernelSU-Next
        if: env.KERNELSU_AUTO_GET == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Disable git credential helper to prevent interactive prompts
          git config --global credential.helper ""

          if [[ -d "KernelSU-Next" ]]; then
            echo "[+] KernelSU-Next already exists, skipping..."
          else
            echo "[+] Getting KernelSU-Next (legacy branch for non-GKI)..."

            GIT_TERMINAL_PROMPT=0 git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next -b legacy

            echo "[+] KernelSU-Next cloned successfully."
          fi

      - name: Fix gcc-wrapper.py for Python 3
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          if [[ -f "scripts/gcc-wrapper.py" ]]; then
            echo "[+] Patching gcc-wrapper.py for Python 3..."

            # Fix Python 2 print statements using sed
            # print "string", -> print("string")
            sed -i 's/print "\(.*\)",\?$/print("\1")/' scripts/gcc-wrapper.py
            # print var, expr -> print(var, expr)
            sed -i 's/print \(.*\), \(.*\)$/print(\1, \2)/' scripts/gcc-wrapper.py
            # print var, -> print(var, end="")
            sed -i 's/print \([^,]*\),$/print(\1, end="")/' scripts/gcc-wrapper.py
            # print "string" expr -> print("string", expr)
            sed -i 's/print "\([^"]*\)" \(.*\)$/print("\1", \2)/' scripts/gcc-wrapper.py
            # print args[0] + ':',e.strerror -> print(args[0] + ':', e.strerror)
            sed -i "s/print \(args\[0\]\) + ':',\(.*\)$/print(\1 + ':', \2)/" scripts/gcc-wrapper.py
            # print 'string' -> print('string')
            sed -i "s/print '\(.*\)'$/print('\1')/" scripts/gcc-wrapper.py
            # print 'string', -> print('string')
            sed -i "s/print '\(.*\)',$/print('\1')/" scripts/gcc-wrapper.py

            echo "[+] gcc-wrapper.py patched."
          fi

      - name: Fix Clang 19 stack_pointer register issue
        if: env.FIX_STACK_POINTER == 'true'
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          echo "[+] Fixing Clang 19 register issue in stack_pointer.h..."

          # Backup original
          cp arch/arm64/include/asm/stack_pointer.h arch/arm64/include/asm/stack_pointer.h.bak

          # Fix the global register variable issue
          sed -i 's/register long sp asm("sp");/\/\/ register long sp asm("sp"); \/\/ Disabled for Clang 19/' arch/arm64/include/asm/stack_pointer.h

          echo "[+] stack_pointer.h patched."
