name: 'Compile kernel'

runs:
  using: 'composite'
  steps:
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.22
        with:
          key: build-kernel-${{ env.DEVICE_NAME }}
          max-size: 2G

      - name: Setup Environment
        shell: bash
        run: |
          echo "DEBUG: KERNEL_ARCH=${{ env.KERNEL_ARCH }}"
          echo "DEBUG: CLANG_SOURCE=${{ env.CLANG_SOURCE }}"
          echo "DEBUG: DEFCONFIG_NAME=${{ env.DEFCONFIG_NAME }}"
          echo "DEBUG: CUSTOM_CMDS=${{ env.CUSTOM_CMDS }}"
          echo "DEBUG: EXTRA_CMDS=${{ env.EXTRA_CMDS }}"

          # Setup paths
          export PATH=$GITHUB_WORKSPACE/device_kernel:$PATH

          # Find clang
          if [ -n "${{ env.CLANG_SOURCE }}" ]; then
            if [ -d "$GITHUB_WORKSPACE/clang-custom/bin" ]; then
              export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH
              echo "[+] Using clang from clang-custom"
            elif [ -d "$GITHUB_WORKSPACE/LLVM-19.1.7-Linux-X64/bin" ]; then
              export PATH=$GITHUB_WORKSPACE/LLVM-19.1.7-Linux-X64/bin:$PATH
              echo "[+] Using clang from LLVM-19.1.7-Linux-X64"
            fi
            # Verify clang
            which clang && clang --version || echo "[-] clang not found in PATH"
          fi

          # Setup GCC if needed
          if [ -n "${{ env.GCC_64 }}" ]; then
            export PATH=${{ env.GCC_64 }}/bin:$PATH
          fi

          if [ -n "${{ env.GCC_32 }}" ]; then
            export PATH=${{ env.GCC_32 }}/bin:$PATH
          fi

      - name: Build Kernel
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Verify environment
          echo "DEBUG: Working directory: $(pwd)"
          echo "DEBUG: Checking for out directory..."
          ls -la out/ 2>/dev/null || echo "out/ does not exist yet"
          echo "DEBUG: Checking .config..."
          cat out/.config 2>/dev/null | head -20 || echo ".config not found"

      - name: Read Defconfig
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          echo "======================="
          echo "=Read Defconfig="
          echo "======================="

          # Setup paths
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH

          echo "[+] Running defconfig..."
          make ARCH=arm64 ${{ env.DEFCONFIG_NAME }} O=out

          echo "[+] Defconfig completed."
          ls -la out/.config 2>/dev/null && head -30 out/.config || echo "[-] .config not created"

      - name: Build Kernel Image
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel/

          # Setup paths
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH

          echo "======================"
          echo "=Build Kernel Image="
          echo "======================"

          # Build
          make -j$(nproc --all) ARCH=arm64 CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 O=out 2>&1 | tee build.log

          BUILD_RESULT=${PIPESTATUS[0]}
          echo "DEBUG: Build exit code: $BUILD_RESULT"

          # Check if build succeeded
          if [ -f "out/arch/arm64/boot/Image.lz4" ] || [ -f "out/arch/arm64/boot/Image" ]; then
            echo "[+] Kernel build completed successfully!"
          else
            echo "[-] Kernel build failed!"
            echo "Last 100 lines of build.log:"
            tail -100 build.log
            exit 1
          fi
